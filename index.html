<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <!-- Collegamento al Manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- Icona per iOS (Safari non legge bene il manifest per l'icona home) -->
    <link rel="apple-touch-icon" href="logo.png">

    <!-- Colore della barra di stato su mobile -->
    <meta name="theme-color" content="#000000">

    <title>Traiano Booking</title>
    
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.0/xlsx.full.min.js"></script>
	  <script src="./script/core.js"></script>

  </head>
  <body onload="initializeApp()">
    <header class="page-header">
      <div class="page-header-main">
        <button id="backToListBtn" type="button" class="header-button" onclick="showListView()" aria-label="Torna alle prenotazioni" title="Torna alle prenotazioni" hidden>
          <i class="fa fa-arrow-left" aria-hidden="true"></i>
        </button>
        <h1>Prenotazioni</h1>
        <button id="insertBookingBtn" type="button" class="header-button" onclick="showInsertBooking()" aria-label="Nuova prenotazione" title="Nuova prenotazione">
          <i class="fa fa-plus" aria-hidden="true"></i>
        </button>
      </div>
    </header>
    
    <div class="tabbar">
         <button id="listViewBtn" class="tabButton active" onclick="showListView()">
            <i class="fa fa-list" aria-hidden="true"></i>
            <span>Bookings</span>
         </button>
         <button id="calendarViewBtn" class="tabButton" onclick="showCalendarView()">
            <i class="fa fa-calendar" aria-hidden="true"></i>
            <span>Calendar</span>
         </button>
         <button id="graphicViewBtn" class="tabButton" onclick="showGraphicView()">
            <i class="fa fa fa-university" aria-hidden="true"></i>
            <span>Revenue</span>
         </button>
    </div>

    <div class="content">
        <div id="listView" class="view active">
          <div class="list-actions">
            <input type="text" class="search-input" placeholder="Cerca prenotazione" onkeyup="filterBookings(this)">
            <div id="bookingYearSelector" class="booking-year-selector" role="group" aria-label="Anno prenotazioni">
              <button type="button" class="booking-year-button" data-year="2027" aria-pressed="false" onclick="changeBookingYear('2027')">2027</button>
              <button type="button" class="booking-year-button" data-year="2026" aria-pressed="false" onclick="changeBookingYear('2026')">2026</button>
            </div>
          </div>
          <img src="./img/loading.gif" alt="Caricamento..." id="loadingIndicator" width="50" height="50">
          <div id="bookingItems"></div>
        </div>

        <div id="calendarView" class="view">
            <!-- Il calendario verrà generato qui dinamicamente -->
            
        </div>

        <div id="graphicView" class="view">
            <!-- Il grafico verrà generato qui dinamicamente -->
        </div>       

        <div id="insertBookingView" class="view"></div>

    </div>

  </body>
</html>
