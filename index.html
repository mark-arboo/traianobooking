<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <!-- Collegamento al Manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- Icona per iOS (Safari non legge bene il manifest per l'icona home) -->
    <link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png">

    <!-- Colore della barra di stato su mobile -->
    <meta name="theme-color" content="#000000">

    <title>Traiano Booking</title>
    
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.0/xlsx.full.min.js"></script>
	  <script src="./script/core.js"></script>

  </head>
  <body onload="initializeApp()">
    <header class="page-header" hidden>
      <div class="page-header-main">
        <button id="backToListBtn" type="button" class="header-button" onclick="showListView()" aria-label="Torna alle prenotazioni" title="Torna alle prenotazioni" hidden>
          <i class="fa fa-arrow-left" aria-hidden="true"></i>
        </button>
        <button id="backToExpensesBtn" type="button" class="header-button" onclick="showListExpenses()" aria-label="Torna alle spese" title="Torna alle spese" hidden>
          <i class="fa fa-arrow-left" aria-hidden="true"></i>
        </button>
        <h1>Prenotazioni</h1>
        <button id="insertBookingBtn" type="button" class="header-button" onclick="showInsertBooking()" aria-label="Nuova prenotazione" title="Nuova prenotazione">
          <i class="fa fa-plus" aria-hidden="true"></i>
        </button>
        <button id="insertExpenseBtn" type="button" class="header-button" onclick="showInsertExpense()" aria-label="Nuova spesa" title="Nuova spesa" hidden>
          <i class="fa fa-plus" aria-hidden="true"></i>
        </button>
      </div>
    </header>
    
    <div class="tabbar" hidden>
         <button id="listViewBtn" class="tabButton active" onclick="showListView()">
            <i class="fa fa-list" aria-hidden="true"></i>
            <span>Elenco</span>
         </button>
         <button id="calendarViewBtn" class="tabButton" onclick="showCalendarView()">
            <i class="fa fa-calendar" aria-hidden="true"></i>
            <span>Calendario</span>
         </button>
         <button id="expensesViewBtn" class="tabButton" onclick="showListExpenses()">
            <i class="fa fa-credit-card" aria-hidden="true"></i>
            <span>Spese</span>
         </button>
         <button id="graphicViewBtn" class="tabButton" onclick="showGraphicView()">
            <i class="fa fa fa-university" aria-hidden="true"></i>
            <span>Profitto</span>
         </button>

    </div>

    <div class="content">
        <div id="loginView" class="view active">
          <div class="login-card">
            <div class="login-brand">
              <img src="./img/logo_192x192.png" alt="Logo Traiano Booking" class="login-logo" width="96" height="96">
              <h1 class="login-title">Traiano Booking</h1>
            </div>
            <form id="loginForm" class="login-form" autocomplete="on">
              <div class="booking-field">
                <label for="loginUsername">Username</label>
                <input id="loginUsername" name="username" type="text" autocomplete="username" required>
              </div>
              <div class="booking-field">
                <label for="loginPassword">Password</label>
                <div class="login-password-control">
                  <input id="loginPassword" name="password" type="password" autocomplete="current-password" required>
                  <button id="loginPasswordToggle" type="button" class="login-password-toggle" onclick="toggleLoginPasswordVisibility()" aria-label="Mostra password" aria-controls="loginPassword" aria-pressed="false" title="Mostra password">
                    <i class="fa fa-eye" aria-hidden="true"></i>
                  </button>
                </div>
              </div>
              <p id="loginStatus" class="login-status" role="alert"></p>
              <button type="submit" class="booking-submit">Accedi</button>
            </form>
          </div>
        </div>

        <div id="listView" class="view">
          <div class="list-actions">
            <div class="search-field">
              <i class="fa fa-search" aria-hidden="true"></i>
              <input type="text" class="search-input" placeholder="Cerca prenotazione" aria-label="Cerca prenotazione" onkeyup="filterBookings(this)">
            </div>
            <div id="bookingYearSelector" class="booking-year-selector" role="group" aria-label="Anno prenotazioni">
              <button type="button" class="booking-year-button" data-year="tutti" aria-pressed="false" onclick="changeBookingYear('tutti')">Tutti</button>
              <button type="button" class="booking-year-button" data-year="2027" aria-pressed="false" onclick="changeBookingYear('2027')">2027</button>
              <button type="button" class="booking-year-button" data-year="2026" aria-pressed="false" onclick="changeBookingYear('2026')">2026</button>
            </div>
          </div>
          <img src="./img/loading.gif" alt="Caricamento..." id="loadingIndicator" width="50" height="50" hidden>
          <div id="bookingItems"></div>
        </div>

        <div id="expensesView" class="view" aria-busy="false">
          <img src="./img/loading.gif" alt="Caricamento spese..." id="expensesLoadingIndicator" width="50" height="50" hidden>
          <p id="expensesStatus" class="expenses-status" role="status" aria-live="polite" hidden></p>
          <div id="expenseItems"></div>
        </div>

        <div id="calendarView" class="view">
            <!-- Il calendario verrà generato qui dinamicamente -->
            
        </div>

        <div id="graphicView" class="view">
            <!-- Il grafico verrà generato qui dinamicamente -->
        </div>       

        <div id="insertBookingView" class="view"></div>
        <div id="insertExpenseView" class="view"></div>

    </div>

  </body>
</html>
